{% extends 'master.html' %}

{% block title %}
    Home
{% endblock %}


{% block body %}
   <div class="container">

       {% for product in products %}
         <h2>{{ product.name }}</h2>
         <p>Ksh {{ product.price }}</p>
         <p>{{ product.category }}</p>
         <a href="{% url 'edit' product.id %}" class="btn btn-info"><i class="bi bi-pen-fill"></i></a>
         <a href="{% url 'delete' product.id %}" class="btn btn-danger"><i class="bi bi-archive-fill"></i></a>
         <a href="{% url 'details' product.id %}" class="btn btn-primary">Details</a>
       <hr>
       {% endfor %}

   </div>
{% endblock %}
